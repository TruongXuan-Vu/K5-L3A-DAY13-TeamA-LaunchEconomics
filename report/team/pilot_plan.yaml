# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Đã điền đầy đủ, không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"

# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: n = 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm -> cần 42 người mỗi nhóm, tổng 84 > 40: KHÔNG ĐỦ NGƯỜI
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa = 20 / 0,02 = 1.000 < 1.251: KHÔNG ĐẠT
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa = 6 / 0,02 = 300
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m ≥ 299 yêu cầu mỗi người (DE = 6,96)

# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Theo kế hoạch, 20 nhân viên đối chứng xử lý cùng loại yêu cầu, cùng tuần và trong các depot có nhóm trợ lý; so sánh chính thức từ bước rollout 0,50.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên theo nhân viên, phân tầng theo depot, seed cố định 20261121; phân bổ tổng cộng 20 người mỗi nhóm và lưu danh sách trước khi chạy, không chia lại theo kết quả.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ gợi ý giữa đồng nghiệp; chỉ cấp quyền trợ lý cho nhóm can thiệp, không chia sẻ gợi ý sang đối chứng, ghi staff_id/arm/trace_id khi mở trợ lý và rà soát truy cập sai nhóm hằng tuần.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Phải chốt phiên bản kế hoạch trước khi chạy: chỉ số đóng trong 24 giờ không mở lại 7 ngày, MDE 0,06, alpha 0,05, power 0,80, luật dừng và ngày quyết định 2027-01-05; chỉ phân tích yêu cầu đã đủ 7 ngày theo dõi.
#   5. Ít nhất 20 cụm mỗi nhóm: Có theo thiết kế, mỗi nhân viên là 1 cụm, gồm 20 can thiệp + 20 đối chứng; cần ít nhất 299 yêu cầu thuộc phạm vi/người trong giai đoạn đo chính thức và kiểm tra đủ 20 cụm mỗi nhóm khi phân tích.

# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận mức chênh 6 điểm thay vì 5 điểm vì không đủ nhân viên (chỉ 40 NV, không đủ 84 NV cần thiết cho mức chênh 5 điểm).
#   Với mức chênh 6 điểm, power chỉ còn khoảng 0,64 ở mức 5 điểm (tính bằng statsmodels NormalIndPower với n = 859).
#   Con số bất lợi này đã ghi rõ trong hồ sơ để hội đồng Gate 2a biết.

# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   mo_lai_trong_7_ngay trung bình = 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97%.
#   Ngưỡng tuyệt đối 3% thì pilot bị dừng ngay tuần đầu (vì 3,97% > 3%).
#   Nên so với nhóm đối chứng (chênh +2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×) và doi_tac (0,85×)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
    random_seed: 20261121
    stratify_by: "depot"
  rollout: [0.10, 0.25, 0.50]   # 4 → 10 → 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                   # đánh đổi đã chấp nhận
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng xử lý cùng loại yêu cầu, cùng tuần và trong các depot có nhóm trợ lý; so sánh chính thức từ bước rollout 0,50, giữ nguyên nhóm đã phân bổ"
    spillover_risk: "Có thể chia sẻ gợi ý trong depot; chỉ cấp quyền trợ lý cho nhóm can thiệp, không chia sẻ gợi ý sang đối chứng; ghi staff_id, arm, trace_id khi mở trợ lý và rà soát truy cập sai nhóm hằng tuần; quyền truy cập không loại bỏ hoàn toàn ảnh hưởng gián tiếp"
    predeclared: "Chốt và lưu phiên bản kế hoạch cùng danh sách phân nhóm trước khi chạy: chỉ số chính, MDE 0,06, alpha 0,05, power 0,80, luật dừng, ngày quyết định 2027-01-05; chỉ phân tích yêu cầu đủ 7 ngày theo dõi, không đổi kế hoạch theo kết quả giữa kỳ"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm hoặc vượt 6%, hoặc có ≥ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU chi phí mỗi việc thành công > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs: ["cps 4.472 đ [sim]", "làm lại 51,8% [sim]", "xem lại 40,7% [sim]", "cps plus cố định 4.599 đ [sim]", "xem lại 100% = 11.743 đ = 0,98× [sim]"]
